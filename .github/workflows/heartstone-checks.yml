name: Heartstone backend checks

on:
  push:
    branches:
      - heartstone-v1-hardening
  pull_request:

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        run: |
          find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check frontend JavaScript syntax
        run: |
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
