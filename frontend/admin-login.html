<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Sign In | Heartstone Lagos</title>
    <link rel="stylesheet" href="css/heartstone-admin.css">
    <link rel="stylesheet" href="css/heartstone-shared.css">
</head>

<body class="admin-login">
    <header class="top"><a class="brand" href="index.html">HEARTSTONE
            <small>LAGOS</small></a><span>ADMINISTRATION</span></header>
    <main class="wrap">
        <section class="card">
            <p class="eyebrow">PRIVATE ACCESS</p>
            <h1>Welcome back.</h1>
            <p class="muted">Sign in with your authorized Heartstone Lagos administrator account.</p>
            <form id="loginForm"><label for="email">Administrator email</label><input id="email" type="email"
                    autocomplete="username" required><label for="password">Password</label><input id="password"
                    type="password" autocomplete="current-password" required><button id="loginButton">Sign in
                    <span>→</span></button>
                <p id="message" role="status"></p>
            </form><a class="back" href="index.html">← Return to website</a>
        </section>
    </main>

    <script src="js/heartstone-data.js"></script>
    <script src="js/heartstone-interface.js"></script>
    <script src="js/heartstone-auth-forms.js"></script>
</body>

</html>
